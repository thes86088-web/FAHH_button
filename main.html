
<style>
    
    #shadow{
        position: relative;
        left: 20%; top : 25%;
        background-color: black; 
        height: 70%;
        width: 70%;
        border-radius: 50%;
    }

    #press{
        position: relative;
        left: 2.5%;
        top : 2.5%;
        height: 95%;
        width: 95%;
        background-color: rgb(255,0,0);
        border-radius: 50%;
    }

    #message{
        position: relative;
        left : 25% ; top: 35%; 
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        font-size: 800%;

    }

</style>

<html>
<div id="shadow">
    <div id="press" >
        <p id="message">FAHH</p>
    </div>
</div>

    <script>

        function changeShade()
        {
            var red_ = Math.floor(Math.random()*256);
            var green_ = Math.floor(Math.random()*256);
            var blue_ = Math.floor(Math.random()*256);

            document.getElementById("press").style.backgroundColor = `rgb(${red_}, ${green_}, ${blue_})` ;
        }
        
        function playSound()
        {
            var x = new Audio("FAHH.mp3");
            changeShade() ;
            x.play() ;
        }
        

        const press = document.getElementById("press") ;
        press.addEventListener("click", playSound  )

    </script>

</html>
